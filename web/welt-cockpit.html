<script>
(function(){
  var T=window.HeiBenTrack;
  function qp(k){ return new URLSearchParams(location.search).get(k); }
  var WELTEN=window.HEIBEN_WELTEN||['reisen','wohnen','kulinarik','immobilien','studio'];
  var welt=qp('welt'); if(WELTEN.indexOf(welt)<0) welt='reisen';
  var F=window.HEIBEN_FIRMA(welt);
  document.documentElement.style.setProperty('--welt',F.farbe||'#1f1c17');
  document.getElementById('eyebrow').textContent=F.kurz+' · Cockpit · intern';
  document.getElementById('title').textContent=F.kurz+' — Cockpit';
  document.getElementById('footName').textContent=(F.name+' '+(F.rechtsform||''));
  document.title='HeiBen · '+F.kurz+' Cockpit';
  document.getElementById('firma').innerHTML=
    '<div><div class="l">Firmierung</div>'+F.name+' '+(F.rechtsform||'')+'</div>'+
    '<div><div class="l">Leistung</div>'+(F.leistung||'')+'</div>'+
    '<div><div class="l">Register</div>'+(F.register||'')+'</div>'+
    '<div><div class="l">USt-IdNr.</div>'+(F.ustid||'')+'</div>'+
    '<div><div class="l">Geschäftsführung</div>'+((F.gf||[]).join(' · '))+'</div>';
  var planerMap={reisen:'reisen-planer.html',wohnen:'wohnen-planer.html',kulinarik:'kulinarik-planner.html',immobilien:'immobilien-planner.html',studio:'studio-lebenswissen-redaktion.html'};
  document.getElementById('planerBtn').addEventListener('click',function(){ location.href=planerMap[welt]||'index.html'; });

  // Welt-Navigation
  document.getElementById('weltnav').innerHTML=WELTEN.map(function(w){ var f=window.HEIBEN_FIRMA(w);
    return '<a class="wchip'+(w===welt?' on':'')+'" '+(w===welt?'style="--welt:'+(f.farbe)+';"':'')+' href="welt-cockpit.html?welt='+w+'">'+f.kurz.replace('HeiBen ','')+'</a>'; }).join('');

  var L=window.HeiBenLedger;
  var q='',fTyp='',fStatus='',sortBy='datum';
  function eur(n){ return (Math.round((+n||0)*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function list(){
    var a=L.byWelt(welt);
    if(q){ a=a.filter(function(x){ return ((x.referenz||'')+' '+(x.kunde||'')+' '+(x.titel||'')).toLowerCase().indexOf(q)>=0; }); }
    if(fTyp) a=a.filter(function(x){ return x.typ===fTyp; });
    if(fStatus) a=a.filter(function(x){ return (x.status||'')===fStatus; });
    a.sort(function(x,y){ if(sortBy==='total') return (+y.total||0)-(+x.total||0); if(sortBy==='ref') return (''+x.referenz).localeCompare(''+y.referenz); return (y.datum||'').localeCompare(x.datum||''); });
    return a;
  }
  function renderKpis(){
    var k=L.kpis(L.byWelt(welt));
    document.getElementById('kpis').innerHTML=
      '<div class="kpi"><div class="b">'+k.count+'</div><div class="l">Vorgänge</div></div>'+
      '<div class="kpi"><div class="b">'+k.angebote+'</div><div class="l">Angebote</div></div>'+
      '<div class="kpi"><div class="b">'+k.buchungen+'</div><div class="l">Buchungen</div></div>'+
      '<div class="kpi"><div class="b">'+k.gebucht+'</div><div class="l">gebucht</div></div>'+
      '<div class="kpi"><div class="b">'+eur(k.volumen)+' €</div><div class="l">Volumen</div></div>';
  }
  function today(){ return new Date().toISOString().slice(0,10); }
  function render(){
    renderKpis();
    var a=list();
    document.getElementById('count').textContent=a.length+' Vorgang/Vorgänge';
    if(!a.length){ document.getElementById('tableWrap').innerHTML='<div class="empty">Noch keine Vorgänge in dieser Welt. Angebote und Buchungen aus dem Planer erscheinen hier automatisch.<br><br><button class="btn welt" id="demo2">Beispiel-Vorgänge laden</button></div>';
      var d2=document.getElementById('demo2'); if(d2)d2.addEventListener('click',seed); return; }
    var rows=a.map(function(x){
      var st=x.status||(x.typ==='angebot'?'angebot':'gebucht');
      var canRech=(x.typ==='buchung'||(x.positionen&&x.positionen.length)); var nDocs=(x.belege&&x.belege.length)||0; var canStorno=(x.typ==='buchung'&&(x.status||'')!=='storniert'); var pay=(x.rechnungNr?(x.bezahlt?'bezahlt':((x.faelligAm&&x.faelligAm<today())?'überfällig':'offen')):null); var payKey=(pay==='überfällig'?'faellig':pay); var canMahn=(pay&&pay!=='bezahlt');
      return '<tr><td>'+(x.datum||'').slice(0,10)+'</td>'+
        '<td class="typ">'+(x.typ==='angebot'?'Angebot':'Buchung')+'</td>'+
        '<td><b>'+(x.referenz||'—')+'</b></td>'+
        '<td>'+(x.titel||x.kunde||'—')+(x.kunde&&x.titel?' · '+x.kunde:'')+'</td>'+
        '<td class="r">'+(x.persons||'')+'</td>'+
        '<td class="r">'+(x.total!=null?eur(x.total)+' €':'')+'</td>'+
        '<td><span class="pill '+st+'" data-tog="'+x.id+'" title="Status umschalten">'+st+'</span>'+(pay?' <span class="pill pay-'+payKey+'" data-pay="'+x.id+'" title="Zahlung umschalten">'+pay+'</span>':'')+'</td>'+
        '<td class="r">'+(canRech?'<button class="iconbtn" data-rech="'+x.id+'">Rechnung</button> ':'')+(canStorno?'<button class="iconbtn" data-storno="'+x.id+'">Storno</button> ':'')+(canMahn?'<button class="iconbtn" data-mahn="'+x.id+'">Mahnung</button> ':'')+'<button class="iconbtn" data-beleg="'+x.id+'">Beleg</button> <button class="iconbtn" data-arch="'+x.id+'">Archiv'+(nDocs?' ('+nDocs+')':'')+'</button> <button class="iconbtn" data-del="'+x.id+'">×</button></td></tr>'+
        '<tr class="archrow" id="arch-'+x.id+'" style="display:none;"><td colspan="8">'+(nDocs? x.belege.map(function(d,i){ return '<div class="archdoc"><span class="adoc-art">'+d.art+'</span> <b>'+d.nr+'</b> · '+(d.datum||'').slice(0,10)+' <button class="iconbtn" data-open="'+x.id+':'+i+'">öffnen</button></div>'; }).join('') : '<span class="note">Noch keine Dokumente erzeugt — „Beleg" oder „Rechnung" legt eine archivierte Fassung an.</span>')+'</td></tr>';
    }).join('');
    document.getElementById('tableWrap').innerHTML='<table><thead><tr><th>Datum</th><th>Typ</th><th>Referenz</th><th>Titel / Kunde</th><th class="r">Pers.</th><th class="r">Volumen</th><th>Status</th><th class="r">Aktion</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  document.getElementById('tableWrap').addEventListener('click',function(e){
    var tg=e.target.closest('[data-tog]'); if(tg){ var it=byId(tg.dataset.tog); if(it&&it.status!=='storniert'){ it.status=(it.status==='gebucht')?'offen':'gebucht'; L.update(welt,it.referenz,{status:it.status}); render(); } return; }
    var ar=e.target.closest('[data-arch]'); if(ar){ var row=document.getElementById('arch-'+ar.dataset.arch); if(row) row.style.display=(row.style.display==='none'?'table-row':'none'); return; }
    var op=e.target.closest('[data-open]'); if(op){ var pp=op.dataset.open.split(':'); var xx=byId(pp[0]); if(xx){ var d=(xx.belege||[])[+pp[1]]; if(d&&d.art==='Rechnung') rechnung(xx); else if(d&&d.art==='Stornobeleg') storno(xx); else if(d&&/^Mahnung/.test(d.art)) mahnung(xx,{nr:d.nr,stufe:(parseInt((d.art.match(/\d+/)||[1])[0],10)+1)}); else beleg(xx); } return; }
    var rc=e.target.closest('[data-rech]'); if(rc){ rechnung(byId(rc.dataset.rech)); return; }
    var sto=e.target.closest('[data-storno]'); if(sto){ storno(byId(sto.dataset.storno)); return; }
    var pa=e.target.closest('[data-pay]'); if(pa){ var px=byId(pa.dataset.pay); if(px){ px.bezahlt=px.bezahlt?null:today(); L.update(welt,px.referenz,{bezahlt:px.bezahlt}); render(); } return; }
    var ma=e.target.closest('[data-mahn]'); if(ma){ mahnung(byId(ma.dataset.mahn)); return; }
    var bl=e.target.closest('[data-beleg]'); if(bl){ beleg(byId(bl.dataset.beleg)); return; }
    var dl=e.target.closest('[data-del]'); if(dl){ if(confirm('Vorgang entfernen?')){ L.remove(dl.dataset.del); render(); } return; }
  });
  function byId(id){ return L.byWelt(welt).filter(function(x){return x.id===id;})[0]; }
  function archive(x,art,nr){ if(!x||!nr)return; x.belege=x.belege||[]; var ex=x.belege.filter(function(d){return d.art===art&&d.nr===nr;})[0]; if(!ex){ x.belege.push({art:art,nr:nr,datum:new Date().toISOString()}); L.update(welt,x.referenz,{belege:x.belege}); render(); } }
  function beleg(x){ if(!x)return;
    var positionen=(x.positionen&&x.positionen.length)?x.positionen:[{t:(x.titel||F.leistungswort||'Leistung'),menge:x.persons||1,summe:x.total||0,einzel:(x.persons?(x.total||0)/x.persons:x.total||0)}];
    window.HeiBenAngebot.dokument({welt:welt,typ:(x.typ==='angebot'?'angebot':'auftrag'),referenz:x.referenz,kunde:x.kunde||x.titel,persons:x.persons,positionen:positionen,gesamt:x.total,gueltigBis:x.gueltigBis,datum:x.datum});
    archive(x,(x.typ==='angebot'?'Angebot':'Auftragsbestätigung'),x.referenz);
    if(T)T.ev('cockpit_beleg',{welt:welt,ref:x.referenz});
  }
  function rechnung(x){ if(!x)return; if(!(window.HeiBenPDF&&window.HeiBenPDF.rechnung)){ alert('PDF-Modul nicht verfügbar.'); return; }
    if(!x.rechnungNr){ x.rechnungNr=L.nextNr(welt,'RE'); x.rechnungDatum=today(); x.faelligAm=new Date(Date.now()+14*86400000).toISOString().slice(0,10); x.bezahlt=null; L.update(welt,x.referenz,{rechnungNr:x.rechnungNr,rechnungDatum:x.rechnungDatum,faelligAm:x.faelligAm,bezahlt:null}); render(); }
    var positionen=(x.positionen&&x.positionen.length)?x.positionen:[{t:(x.titel||F.leistungswort||'Leistung'),menge:x.persons||1,summe:x.total||0,einzel:(x.persons?(x.total||0)/x.persons:x.total||0)}];
    window.HeiBenPDF.rechnung({welt:welt,referenz:x.rechnungNr,auftragRef:x.referenz,kunde:x.kunde||x.titel,persons:x.persons,positionen:positionen,gesamt:x.total,datum:new Date().toISOString(),leistungsdatum:x.datum});
    archive(x,'Rechnung',x.rechnungNr);
    if(T)T.ev('cockpit_rechnung',{welt:welt,ref:x.rechnungNr});
  }
  function storno(x){ if(!x)return; if(!(window.HeiBenPDF&&window.HeiBenPDF.storno)){ alert('PDF-Modul nicht verfügbar.'); return; }
    var already=((x.status||'')==='storniert');
    if(!already){ if(!confirm('Diesen Vorgang stornieren? Das Volumen wird aus der Auswertung genommen.')) return; }
    if(!x.stornoNr){ x.stornoNr=L.nextNr(welt,'ST'); }
    if(!already){ x.status='storniert'; L.update(welt,x.referenz,{status:'storniert',stornoNr:x.stornoNr}); } else { L.update(welt,x.referenz,{stornoNr:x.stornoNr}); }
    var positionen=(x.positionen&&x.positionen.length)?x.positionen:[{t:(x.titel||F.leistungswort||'Leistung'),menge:x.persons||1,summe:x.total||0,einzel:(x.persons?(x.total||0)/x.persons:x.total||0)}];
    window.HeiBenPDF.storno({welt:welt,referenz:x.stornoNr,originalRef:(x.rechnungNr||x.referenz),originalTyp:(x.rechnungNr?'Rechnung':'Auftrag'),kunde:x.kunde||x.titel,persons:x.persons,positionen:positionen,gesamt:x.total,datum:new Date().toISOString()});
    archive(x,'Stornobeleg',x.stornoNr); if(!already) render();
    if(T)T.ev('cockpit_storno',{welt:welt,ref:x.stornoNr});
  }
  function mahnung(x, fixed){ if(!x||!x.rechnungNr)return; if(!(window.HeiBenPDF&&window.HeiBenPDF.mahnung)){ alert('PDF-Modul nicht verfügbar.'); return; }
    var stufe, nr, isNew=!fixed;
    if(fixed){ stufe=fixed.stufe||x.mahnstufe||1; nr=fixed.nr; } else { x.mahnstufe=(x.mahnstufe||0)+1; stufe=x.mahnstufe; nr=L.nextNr(welt,'MA'); }
    var alt=x.faelligAm||x.rechnungDatum; var neueFrist=new Date(Date.now()+7*86400000).toISOString().slice(0,10); var gebuehr=(stufe>=2?5:0);
    window.HeiBenPDF.mahnung({welt:welt,referenz:nr,rechnungNr:x.rechnungNr,kunde:x.kunde||x.titel,datum:new Date().toISOString(),faelligAlt:alt,betrag:x.total,mahnstufe:stufe,neueFrist:neueFrist,gebuehr:gebuehr});
    if(isNew){ L.update(welt,x.referenz,{mahnstufe:x.mahnstufe,letzteMahnung:nr}); archive(x,'Mahnung (Stufe '+stufe+')',nr); render(); }
    if(T)T.ev('cockpit_mahnung',{welt:welt,ref:nr,stufe:stufe});
  }
  document.getElementById('q').addEventListener('input',function(e){ q=e.target.value.trim().toLowerCase(); render(); });
  document.getElementById('fTyp').addEventListener('change',function(e){ fTyp=e.target.value; render(); });
  document.getElementById('fStatus').addEventListener('change',function(e){ fStatus=e.target.value; render(); });
  document.getElementById('sort').addEventListener('change',function(e){ sortBy=e.target.value; render(); });
  document.getElementById('csv').addEventListener('click',function(){
    var a=list(); var head=['datum','typ','referenz','titel','kunde','personen','volumen','status'];
    var rows=a.map(function(x){ return [ (x.datum||'').slice(0,10),x.typ,x.referenz,(x.titel||'').replace(/;/g,','),(x.kunde||'').replace(/;/g,','),x.persons||'',x.total!=null?(''+x.total).replace('.',','):'',x.status||'' ].join(';'); });
    var csv=head.join(';')+'\n'+rows.join('\n');
    var b=new Blob(["\ufeff"+csv],{type:'text/csv'}); var u=URL.createObjectURL(b); var el=document.createElement('a'); el.href=u; el.download='cockpit-'+welt+'.csv'; document.body.appendChild(el); el.click(); el.remove(); setTimeout(function(){URL.revokeObjectURL(u);},800);
  });
  document.getElementById('bw').addEventListener('click',function(){
    var rows=L.buchhaltungRows(L.byWelt(welt)); function c(n){ return (''+n).replace('.',','); }
    var head=['Datum','Belegart','Belegnr','Kunde','Welt','Firmierung','Brutto','Netto_19','USt_19','Netto_7','USt_7','Marge_§25','Zahlstatus','Status'];
    var lines=rows.map(function(r){ return [r.datum,r.belegart,r.belegnr,(r.kunde||'').replace(/;/g,','),r.welt,(r.firma||'').replace(/;/g,','),c(r.brutto),c(r.netto19),c(r.ust19),c(r.netto7),c(r.ust7),c(r.margeBrutto),r.zahlstatus,r.status].join(';'); });
    var csv=head.join(';')+'\n'+lines.join('\n'); var bb=new Blob(["\ufeff"+csv],{type:'text/csv'}); var u=URL.createObjectURL(bb); var el=document.createElement('a'); el.href=u; el.download='buchhaltung-'+welt+'.csv'; document.body.appendChild(el); el.click(); el.remove(); setTimeout(function(){URL.revokeObjectURL(u);},800); if(T)T.ev('cockpit_buchhaltung',{welt:welt});
  });
  function seed(){ var p=(F.refPrefix||'XX-');
    L.log({welt:welt,typ:'angebot',referenz:'q_'+welt.slice(0,3)+'_1',status:'angebot',total:880,persons:4,n:3,titel:'Beispiel-Anfrage',kunde:'Familie Beispiel'});
    L.log({welt:welt,typ:'buchung',referenz:p+'DEMO1',status:'gebucht',total:1490,persons:6,n:4,titel:'Beispiel-Auftrag',kunde:'Familie Muster'});
    render(); if(T)T.ev('cockpit_seed',{welt:welt});
  }
  document.getElementById('demo').addEventListener('click',seed);

  render();
})();
</script>
