<div class="wrap">

  <div class="eyebrow">Kulinarik · Heute kochen</div>
  <h1>Was koche ich <em style="color:var(--accent);font-style:italic;">heute?</em></h1>
  <p class="lede">Drei kurze Fragen — und du hast ein Gericht. Alle Rezepte ohne Schwein, alltagstauglich und in der HeiBen-App mit Mengen, Nährwerten und Einkaufsliste.</p>

  <div class="panel">
    <div class="row">
      <div class="field"><label>Wie viel Zeit?</label><select id="qZeit"><option value="0">egal</option><option value="20">bis 20 Min</option><option value="40">bis 40 Min</option></select></div>
      <div class="field"><label>Worauf Lust?</label><select id="qLust"><option value="">egal</option><option value="schnell">schnell &amp; einfach</option><option value="gesund">leicht &amp; gesund</option><option value="herzhaft">herzhaft</option></select></div>
      <div class="field"><label>Ernährung</label><select id="qErn"><option value="">egal</option><option value="vegetarisch">vegetarisch</option><option value="vegan">vegan</option></select></div>
      <button class="btn primary" id="go">Gericht vorschlagen</button>
    </div>
  </div>

  <div class="result" id="result"></div>

  
<div data-hb-nachbarn></div>

<script src="heiben-analytics.js"></script>
<script>
(function(){
  var T=window.HeiBenTrack;
  var R=[
    {id:'shakshuka',t:'Shakshuka mit Feta',zeit:25,lust:['herzhaft','gesund'],ern:'vegetarisch',kcal:380,kurz:'Tomaten-Paprika-Sugo mit pochierten Eiern und Feta — ein Pfannengericht für jede Tageszeit.'},
    {id:'dal',t:'Roter Linsen-Dal mit Spinat',zeit:30,lust:['gesund','herzhaft'],ern:'vegan',kcal:420,kurz:'Cremiger Dal mit Ingwer, Kreuzkümmel und frischem Spinat. Sättigt und ist günstig.'},
    {id:'ofengemuese',t:'Ofengemüse mit Halloumi',zeit:35,lust:['gesund'],ern:'vegetarisch',kcal:450,kurz:'Bunt geröstetes Gemüse mit goldenem Halloumi und Kräuter-Joghurt.'},
    {id:'limone',t:'Pasta al Limone',zeit:20,lust:['schnell'],ern:'vegetarisch',kcal:520,kurz:'Pasta in seidiger Zitronen-Parmesan-Sauce — fertig in 20 Minuten.'},
    {id:'reispfanne',t:'Hähnchen-Reispfanne',zeit:30,lust:['herzhaft'],ern:'fleisch',kcal:560,kurz:'Reis, knackiges Gemüse und mariniertes Hähnchen aus einer Pfanne.'},
    {id:'curry',t:'Kichererbsen-Curry',zeit:25,lust:['gesund','herzhaft'],ern:'vegan',kcal:430,kurz:'Kokos-Tomaten-Curry mit Kichererbsen — schnell, würzig, vorratstauglich.'},
    {id:'ruehrei',t:'Kräuter-Rührei auf Brot',zeit:10,lust:['schnell'],ern:'vegetarisch',kcal:340,kurz:'Cremiges Rührei mit frischen Kräutern auf kräftigem Sauerteig.'},
    {id:'bolo',t:'Rinderhack-Bolognese',zeit:40,lust:['herzhaft'],ern:'fleisch',kcal:610,kurz:'Langsam geschmorte Bolognese aus Rinderhack — Sonntagsgericht für jeden Tag.'}
  ];
  var ernRank={vegan:0,vegetarisch:1,fleisch:2};
  function match(r,zeit,lust,ern){
    if(zeit && r.zeit>zeit) return false;
    if(lust && r.lust.indexOf(lust)<0) return false;
    if(ern==='vegetarisch' && ernRank[r.ern]>1) return false;
    if(ern==='vegan' && ernRank[r.ern]>0) return false;
    return true;
  }
  function dishHtml(r){
    var tags=[r.zeit+' Min', r.ern.charAt(0).toUpperCase()+r.ern.slice(1), '≈'+r.kcal+' kcal'];
    return '<div class="dish"><div class="hd"><h2>'+r.t+'</h2><div class="tags">'+tags.map(function(x){return '<span class="tag">'+x+'</span>';}).join('')+'</div></div>'+
      '<div class="bd"><p>'+r.kurz+'</p><div class="acts">'+
      '<a class="btn ink sm" href="kulinarik-mealplanner.html">Im Mealplanner öffnen</a>'+
      '<a class="btn ghost sm" href="kulinarik-app.html">Mehr in der App</a></div></div></div>';
  }
  function altPills(list,chosen){
    var others=list.filter(function(r){return r.id!==chosen.id;}).slice(0,4);
    if(!others.length) return '';
    return '<div class="alt"><div class="note">Auch passend:</div><div class="pills">'+
      others.map(function(r){return '<span class="pill" data-id="'+r.id+'">'+r.t+'</span>';}).join('')+'</div></div>';
  }
  var lastList=[];
  function suggest(){
    var zeit=+document.getElementById('qZeit').value, lust=document.getElementById('qLust').value, ern=document.getElementById('qErn').value;
    var list=R.filter(function(r){return match(r,zeit,lust,ern);});
    lastList=list;
    if(T)T.ev('kulinarik_heute',{zeit:zeit,lust:lust,ern:ern,treffer:list.length});
    var box=document.getElementById('result');
    if(!list.length){ box.innerHTML='<p class="note">Kein Treffer — lockere eine Vorgabe (z. B. mehr Zeit) und probiere erneut.</p>'; return; }
    var pick=list[Math.floor(Math.random()*list.length)];
    box.innerHTML=dishHtml(pick)+altPills(list,pick)+'<div style="margin-top:1rem;"><button class="btn ghost sm" id="again">Anderes vorschlagen</button></div>';
  }
  document.getElementById('go').addEventListener('click',suggest);
  document.getElementById('result').addEventListener('click',function(e){
    var p=e.target.closest('[data-id]');
    if(p){ var r=R.filter(function(x){return x.id===p.dataset.id;})[0]; if(r){ document.getElementById('result').innerHTML=dishHtml(r)+altPills(lastList,r)+'<div style="margin-top:1rem;"><button class="btn ghost sm" id="again">Anderes vorschlagen</button></div>'; } return; }
    if(e.target.id==='again'){ suggest(); }
  });
})();
</script>
