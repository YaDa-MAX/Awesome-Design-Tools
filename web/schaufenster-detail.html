<script src="hb-schaufenster-core.js"></script>
<script>
(function () {
  'use strict';
  var S = window.HeiBenSchau;

  function param(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
    return m ? decodeURIComponent(m[1]) : '';
  }

  var id = param('id');
  var entry = id ? S.findById(id) : null;
  var detail = document.getElementById('detail');

  // Freundliche "nicht gefunden"-Seite bei ungültiger Kennung.
  if (!entry || entry.status !== 'published') {
    detail.innerHTML =
      '<a class="back" href="schaufenster.html">← Zurück zur Übersicht</a>' +
      '<div class="schau-empty"><div class="big">Eintrag nicht gefunden</div>' +
      'Dieser Eintrag ist nicht (mehr) verfügbar. In unserer Übersicht finden Sie alles, was wir derzeit zeigen.</div>';
    return;
  }

  var t = S.TYPES[entry.type];
  // Hausfarbe automatisch setzen — dieselbe Mechanik wie bei der Artikelseite.
  document.body.classList.add('theme-' + t.klass);

  var cover = entry.cover
    ? '<div class="schau-cover" style="background-image:url(\'' + S.esc(entry.cover) + '\')"></div>'
    : '';

  var highlights = S.renderHighlights(entry.highlights);
  var desc = S.renderDescription(entry.description);

  detail.innerHTML =
    '<a class="back" href="schaufenster.html?typ=' + S.esc(entry.type) + '">← Alle ' + S.esc(t.nounPlural) + '</a>' +
    '<div class="toprow"><span class="haus-chip ' + t.klass + '">' + S.esc(t.label) + '</span>' + S.statusBadge(entry) + '</div>' +
    '<h1>' + S.esc(entry.title) + '</h1>' +
    (entry.teaser ? '<p class="teaser">' + S.esc(entry.teaser) + '</p>' : '') +
    cover +
    '<div class="factbox">' + S.renderFacts(entry) + '</div>' +
    (desc ? '<div class="desc-title">Über ' + (entry.type === 'reisen' ? 'diese Route' : entry.type === 'wohnen' ? 'dieses Projekt' : 'dieses Objekt') + '</div><div class="desc">' + desc + '</div>' : '') +
    (highlights ? '<div class="hl-title">Höhepunkte</div>' + highlights : '') +
    '<div class="schau-cta">' +
      '<h3>' + ctaTitle(entry.type) + '</h3>' +
      '<a class="btn btn-accent" href="' + S.esc(t.anfrage.href) + '">' + S.esc(t.anfrage.label) + '</a>' +
    '</div>';

  document.title = entry.title + ' — HeiBen ' + t.label;

  function ctaTitle(type) {
    if (type === 'reisen') return 'Klingt das nach Ihrer Reise?';
    if (type === 'wohnen') return 'Möchten Sie so etwas für sich?';
    return 'Interesse an diesem Objekt?';
  }

  // "Mehr aus diesem Haus" — bis zu drei weitere veröffentlichte Einträge.
  var more = S.getPublished(entry.type).filter(function (e) { return e.id !== entry.id; }).slice(0, 3);
  if (more.length) {
    var moreEl = document.getElementById('more');
    moreEl.className = 'schau-more';
    moreEl.innerHTML = '<h3>Mehr aus HeiBen ' + S.esc(t.label) + '</h3>' +
      '<div class="schau-grid" style="padding:0;">' + more.map(function (e) {
        var cv = e.cover ? ' style="background-image:url(\'' + S.esc(e.cover) + '\')"' : '';
        var cc = e.cover ? 'cover' : 'cover empty';
        return '<a class="schau-card" href="schaufenster-detail.html?id=' + encodeURIComponent(e.id) + '">' +
          '<div class="' + cc + '"' + cv + '><div class="topline"><span class="haus-chip ' + t.klass + '">' + S.esc(t.label) + '</span>' + S.statusBadge(e) + '</div></div>' +
          '<div class="body"><h3>' + S.esc(e.title) + '</h3><p class="teaser">' + S.esc(e.teaser || '') + '</p></div></a>';
      }).join('') + '</div>';
  }
})();
</script>
