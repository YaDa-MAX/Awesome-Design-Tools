<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HeiBen — Anfragenverwaltung</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   HeiBen — Gemeinsames Designsystem (alle Seiten laden diese Datei)
   Eine einzige Quelle für Farben, Schrift, Navigation, Footer.
   Seiten-spezifische Blöcke sind klar überschrieben.
   ============================================================ */

:root {
  --bg:#f3eee5; --bg-soft:#ebe3d4; --bg-deep:#1f1c17;
  --ink:#1f1c17; --ink-soft:#524a3e; --rule:#d8cdb7;
  --terracotta:#b04a31; --ochre:#a97a1d; --moss:#4a5c39;
  --burgundy:#792d29; --ink-accent:#2c2620;
  --maxw:1180px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg); color:var(--ink);
  font-family:'Manrope',sans-serif; line-height:1.65; overflow-x:hidden;
  background-image:
    radial-gradient(at 14% 4%, rgba(176,74,49,0.05) 0, transparent 50%),
    radial-gradient(at 86% 96%, rgba(75,93,58,0.06) 0, transparent 55%);
  background-attachment:fixed;
}
.wrap { max-width:var(--maxw); margin:0 auto; padding:0 2rem; }
a { color:inherit; }

/* ===== NAV (identisch auf allen Seiten) ===== */
nav {
  position:sticky; top:0; z-index:100;
  background:rgba(243,238,229,0.82); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
nav .wrap { display:flex; align-items:center; justify-content:space-between; height:68px; }
nav .brand { display:flex; align-items:center; gap:0.6rem; text-decoration:none; }
nav .brand img { height:26px; width:auto; display:block; }
nav .links { display:flex; gap:2rem; list-style:none; }
nav .links a {
  font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.15em;
  text-transform:uppercase; color:var(--ink-soft); text-decoration:none; transition:color .2s;
}
nav .links a:hover, nav .links a.active { color:var(--terracotta); }
nav .cta {
  font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase;
  border:1px solid var(--ink); padding:0.55rem 1rem; text-decoration:none; transition:all .25s;
}
nav .cta:hover { background:var(--ink); color:var(--bg); }
@media (max-width:780px){ nav .links { display:none; } }

/* ===== BUTTONS ===== */
.btn {
  font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.15em; text-transform:uppercase;
  padding:0.9rem 1.6rem; text-decoration:none; transition:all .25s; display:inline-block;
}
.btn-primary { background:var(--terracotta); color:var(--bg); }
.btn-primary:hover { background:var(--ink); }
.btn-ghost { border:1px solid var(--ink); }
.btn-ghost:hover { background:var(--ink); color:var(--bg); }

/* ===== Staggered Load Reveal ===== */
.reveal { opacity:0; transform:translateY(22px); animation:rise .9s cubic-bezier(.5,0,.2,1) forwards; }
.reveal.d1 { animation-delay:.05s; } .reveal.d2 { animation-delay:.18s; }
.reveal.d3 { animation-delay:.31s; } .reveal.d4 { animation-delay:.44s; } .reveal.d5 { animation-delay:.57s; }
@keyframes rise { to { opacity:1; transform:none; } }

/* ===== Generische Sektionsköpfe (wiederverwendbar) ===== */
.sec-head { margin-bottom:3rem; }
.sec-head .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--terracotta); margin-bottom:1rem; }
.sec-head h2 { font-family:'Fraunces',serif; font-weight:400; font-size:clamp(1.9rem,4.5vw,3rem); line-height:1.05; letter-spacing:-0.02em; max-width:24ch; }
.sec-head h2 em { font-style:italic; color:var(--terracotta); }

/* ===== HOMEPAGE: HERO ===== */
.hero { padding:6rem 0 4rem; position:relative; }
.hero .eyebrow {
  font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.3em;
  text-transform:uppercase; color:var(--terracotta); margin-bottom:2rem;
}
.hero-logo { max-width:min(620px, 88%); height:auto; display:block; margin-bottom:2.5rem; }
.hero h1 {
  font-family:'Fraunces',serif; font-weight:300; font-size:clamp(2rem,5vw,3.4rem);
  line-height:1.1; letter-spacing:-0.025em; max-width:20ch; margin-bottom:1.5rem;
}
.hero h1 em { font-style:italic; color:var(--terracotta); }
.hero p.lede { font-size:1.2rem; color:var(--ink-soft); max-width:52ch; margin-bottom:2.5rem; }
.hero .actions { display:flex; gap:1rem; flex-wrap:wrap; }

/* ===== HOMEPAGE: IDEA STRIP ===== */
.idea { background:var(--bg-deep); color:var(--bg); padding:5.5rem 0; position:relative; overflow:hidden; }
.idea::before {
  content:'Hei·Ben'; position:absolute; right:-1rem; bottom:-3rem;
  font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size:16rem;
  color:rgba(243,238,229,0.04); pointer-events:none; line-height:.8;
}
.idea .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--ochre); margin-bottom:1.2rem; }
.idea h2 { font-family:'Fraunces',serif; font-weight:300; font-size:clamp(1.8rem,4vw,3rem); line-height:1.15; max-width:24ch; position:relative; }
.idea h2 em { font-style:italic; color:var(--ochre); }
.idea p { color:rgba(243,238,229,0.82); max-width:58ch; margin-top:1.5rem; position:relative; font-size:1.05rem; }

/* ===== HOMEPAGE: HÄUSER ===== */
.haeuser { padding:6rem 0; }
.haus-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1.5rem; }
@media (max-width:820px){ .haus-grid { grid-template-columns:1fr; } }
.haus {
  background:var(--bg-soft); padding:2.5rem; text-decoration:none; color:inherit;
  border-top:4px solid var(--terracotta); display:flex; flex-direction:column;
  transition:transform .3s ease, box-shadow .3s ease; position:relative; overflow:hidden;
}
.haus:hover { transform:translateY(-4px); box-shadow:0 18px 40px rgba(31,28,23,0.12); }
.haus.reisen { border-top-color:var(--ochre); }
.haus.wohnen { border-top-color:var(--moss); }
.haus.immobilien { border-top-color:var(--burgundy); }
.haus.studio { border-top-color:var(--ink-accent); }
.haus .num { font-family:'JetBrains Mono',monospace; font-size:0.68rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:1.2rem; }
.haus .wm { height:34px; width:auto; margin-bottom:1.2rem; }
.haus h3 { font-family:'Fraunces',serif; font-weight:500; font-size:1.5rem; margin-bottom:0.4rem; }
.haus .role { font-family:'JetBrains Mono',monospace; font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--terracotta); margin-bottom:1rem; }
.haus.reisen .role { color:var(--ochre); }
.haus.wohnen .role { color:var(--moss); }
.haus.immobilien .role { color:var(--burgundy); }
.haus.studio .role { color:var(--ink-accent); }
.haus p { font-size:0.96rem; color:var(--ink-soft); margin-bottom:1.5rem; flex:1; }
.haus .more { font-family:'JetBrains Mono',monospace; font-size:0.68rem; letter-spacing:0.15em; text-transform:uppercase; display:inline-flex; align-items:center; gap:0.4rem; }
.haus .more .arrow { transition:transform .25s; }
.haus:hover .more .arrow { transform:translateX(5px); }

/* ===== HOMEPAGE: KÖLN BAND ===== */
.koeln { padding:5.5rem 0; border-top:1px solid var(--rule); }
.koeln .grid { display:grid; grid-template-columns:1fr 1fr; gap:4rem; align-items:center; }
@media (max-width:820px){ .koeln .grid { grid-template-columns:1fr; gap:2rem; } }
.koeln .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--terracotta); margin-bottom:1rem; }
.koeln h2 { font-family:'Fraunces',serif; font-weight:400; font-size:clamp(1.8rem,4vw,2.6rem); line-height:1.1; letter-spacing:-0.02em; margin-bottom:1.2rem; }
.koeln h2 em { font-style:italic; color:var(--terracotta); }
.koeln p { color:var(--ink-soft); margin-bottom:1rem; }
.koeln .facts { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
.koeln .fact { border-top:1px solid var(--rule); padding-top:1rem; }
.koeln .fact .k { font-family:'Fraunces',serif; font-style:italic; font-size:1.8rem; color:var(--terracotta); line-height:1; }
.koeln .fact .v { font-size:0.88rem; color:var(--ink-soft); margin-top:0.4rem; }

/* ===== FOOTER (identisch auf allen Seiten) ===== */
footer { background:var(--bg-deep); color:var(--bg); padding:5rem 0 2.5rem; }
footer .top { display:grid; grid-template-columns:2fr 1fr 1fr; gap:3rem; margin-bottom:3rem; }
@media (max-width:820px){ footer .top { grid-template-columns:1fr; gap:2rem; } }
footer .brand-block img { height:30px; margin-bottom:1.2rem; }
footer .brand-block p { color:rgba(243,238,229,0.7); max-width:34ch; font-size:0.95rem; }
footer h4 { font-family:'JetBrains Mono',monospace; font-size:0.68rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ochre); margin-bottom:1.2rem; }
footer ul { list-style:none; }
footer ul li { margin-bottom:0.7rem; }
footer ul li a { color:rgba(243,238,229,0.82); text-decoration:none; font-size:0.95rem; transition:color .2s; }
footer ul li a:hover { color:var(--ochre); }
footer .legal {
  border-top:1px solid rgba(243,238,229,0.15); padding-top:1.5rem;
  font-family:'JetBrains Mono',monospace; font-size:0.66rem; letter-spacing:0.08em; line-height:1.9;
  color:rgba(243,238,229,0.5);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:1rem;
}
footer .legal a { color:rgba(243,238,229,0.7); text-decoration:none; }
footer .legal a:hover { color:var(--ochre); }

/* Platzhalter sichtbar markieren, damit sie vor Veröffentlichung ersetzt werden */
.ph { color:var(--ochre); }

/* ============================================================
   RECHTLICHE PFLICHTSEITEN (Impressum / Datenschutz)
   Ruhige, gut lesbare Lesetypografie — bewusst zurückhaltend.
   ============================================================ */
.legalhero { padding:5rem 0 2.5rem; border-bottom:1px solid var(--rule); }
.legalhero .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--terracotta); margin-bottom:1.2rem; }
.legalhero h1 { font-family:'Fraunces',serif; font-weight:300; font-size:clamp(2.2rem,6vw,3.6rem); letter-spacing:-0.03em; line-height:1; }
.legalhero h1 em { font-style:italic; color:var(--terracotta); }
.legalhero p { color:var(--ink-soft); margin-top:1rem; max-width:60ch; }

.legal-body { padding:3.5rem 0 5rem; }
.legal-body .col { max-width:760px; }
.legal-body h2 {
  font-family:'Fraunces',serif; font-weight:500; font-size:1.5rem; letter-spacing:-0.01em;
  margin:2.6rem 0 0.4rem; padding-top:1.6rem; border-top:1px solid var(--rule);
}
.legal-body h2:first-of-type { border-top:none; padding-top:0; margin-top:0; }
.legal-body h3 { font-family:'Fraunces',serif; font-weight:500; font-size:1.12rem; margin:1.6rem 0 0.3rem; }
.legal-body p { margin:0.7rem 0; color:var(--ink); }
.legal-body p.muted { color:var(--ink-soft); font-size:0.95rem; }
.legal-body strong { font-weight:600; }
.legal-body .mono { font-family:'JetBrains Mono',monospace; font-size:0.82rem; letter-spacing:0.04em; color:var(--ink-soft); }
.legal-body address { font-style:normal; line-height:1.9; margin:0.6rem 0; }
.legal-body ul.plain { list-style:none; margin:0.7rem 0; }
.legal-body ul.plain li { padding:0.45rem 0 0.45rem 1.5rem; position:relative; border-bottom:1px dashed var(--rule); }
.legal-body ul.plain li:last-child { border-bottom:none; }
.legal-body ul.plain li::before { content:'→'; position:absolute; left:0; color:var(--terracotta); }
.legal-body .anchor-jump { font-size:0.85rem; }

/* Inhaltsverzeichnis der Rechtsseite */
.legal-toc {
  background:var(--bg-soft); padding:1.6rem 1.8rem; margin:0 0 2.5rem;
}
.legal-toc .lbl { font-family:'JetBrains Mono',monospace; font-size:0.66rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:0.9rem; }
.legal-toc ol { list-style:none; counter-reset:toc; columns:2; column-gap:2.5rem; }
@media (max-width:640px){ .legal-toc ol { columns:1; } }
.legal-toc li { counter-increment:toc; margin-bottom:0.5rem; }
.legal-toc a { text-decoration:none; color:var(--ink); font-size:0.92rem; transition:color .2s; }
.legal-toc a::before { content:counter(toc,decimal-leading-zero) "  "; font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--terracotta); }
.legal-toc a:hover { color:var(--terracotta); }

/* dezenter interner Hinweisstreifen (vor Veröffentlichung entfernen) */
.draft-note {
  background:#792d29; color:#f3eee5; font-family:'JetBrains Mono',monospace;
  font-size:0.7rem; letter-spacing:0.08em; line-height:1.6; padding:0.8rem 0;
}
.draft-note .wrap { display:flex; gap:0.6rem; align-items:baseline; }
.draft-note b { color:#f3c98a; }

[id]{ scroll-margin-top:84px; }

/* ============================================================
   TOCHTER-UNTERSEITEN — gemeinsame Bausteine.
   Die Akzentfarbe steuert eine einzige Variable --accent,
   die pro Seite über eine body-Klasse gesetzt wird.
   ============================================================ */
:root { --accent:var(--terracotta); }                 /* Fallback (Holding) */
body.theme-reisen     { --accent:var(--ochre); }
body.theme-wohnen     { --accent:var(--moss); }
body.theme-immobilien { --accent:var(--burgundy); }
body.theme-studio     { --accent:var(--ink-accent); }

.btn-accent { background:var(--accent); color:var(--bg); }
.btn-accent:hover { background:var(--ink); }

/* --- Unterseiten-Hero --- */
.subhero { padding:5rem 0 3.5rem; border-bottom:1px solid var(--rule); }
.subhero .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); margin-bottom:1.6rem; }
.subhero .wm { height:46px; width:auto; display:block; margin-bottom:1.8rem; }
.subhero h1 { font-family:'Fraunces',serif; font-weight:300; font-size:clamp(2rem,5.5vw,3.6rem); line-height:1.05; letter-spacing:-0.03em; max-width:18ch; margin-bottom:1.4rem; }
.subhero h1 em { font-style:italic; color:var(--accent); }
.subhero p.lede { font-size:1.2rem; color:var(--ink-soft); max-width:54ch; margin-bottom:2.2rem; }
.subhero .actions { display:flex; gap:1rem; flex-wrap:wrap; }

/* --- generische Inhaltssektion --- */
.section { padding:5rem 0; border-top:1px solid var(--rule); }
.section .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--accent); margin-bottom:1rem; }
.section h2 { font-family:'Fraunces',serif; font-weight:400; font-size:clamp(1.7rem,4vw,2.6rem); line-height:1.1; letter-spacing:-0.02em; max-width:24ch; margin-bottom:1.2rem; }
.section h2 em { font-style:italic; color:var(--accent); }
.section p.intro { font-size:1.08rem; color:var(--ink-soft); max-width:62ch; margin-bottom:1rem; }

/* --- Angebots-Karten --- */
.offer-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1.4rem; margin-top:2.5rem; }
@media (max-width:820px){ .offer-grid { grid-template-columns:1fr; } }
.offer { background:var(--bg-soft); padding:2.2rem; border-top:3px solid var(--accent); }
.offer .k { font-family:'JetBrains Mono',monospace; font-size:0.66rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:0.9rem; }
.offer h3 { font-family:'Fraunces',serif; font-weight:500; font-size:1.3rem; margin-bottom:0.6rem; }
.offer p { font-size:0.96rem; color:var(--ink-soft); }

/* --- dunkles Band mit Akzent --- */
.darkband { background:var(--bg-deep); color:var(--bg); padding:5rem 0; position:relative; overflow:hidden; }
.darkband .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--accent); margin-bottom:1.2rem; }
.darkband h2 { font-family:'Fraunces',serif; font-weight:300; font-size:clamp(1.7rem,4vw,2.8rem); line-height:1.15; color:var(--bg); max-width:24ch; }
.darkband h2 em { font-style:italic; color:var(--accent); }
.darkband p { color:rgba(243,238,229,0.82); max-width:58ch; margin-top:1.5rem; font-size:1.04rem; }
.darkband .quote { font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size:clamp(1.4rem,3vw,2rem); line-height:1.3; color:var(--accent); border-left:3px solid var(--accent); padding:0.6rem 0 0.6rem 1.8rem; margin:2rem 0 0; max-width:46ch; }

/* --- Merkmalsliste --- */
.flist { list-style:none; margin-top:1.4rem; max-width:62ch; }
.flist li { padding:0.7rem 0 0.7rem 1.8rem; border-bottom:1px dashed var(--rule); position:relative; color:var(--ink-soft); }
.flist li::before { content:'→'; position:absolute; left:0; color:var(--accent); }
.flist li:last-child { border-bottom:none; }
.flist li strong { color:var(--ink); font-weight:600; }

/* --- Teaser-Panel (z. B. Shop in Vorbereitung) --- */
.teaser { border:2px dashed var(--accent); padding:2.6rem; margin-top:2.5rem; }
.teaser .badge { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; background:var(--accent); color:var(--bg); padding:0.32rem 0.7rem; margin-bottom:1.1rem; }
.teaser h3 { font-family:'Fraunces',serif; font-weight:500; font-size:1.6rem; margin-bottom:0.6rem; }
.teaser p { color:var(--ink-soft); max-width:60ch; margin-bottom:0.7rem; }

/* --- Säulen (Studio) --- */
.pillars { display:grid; grid-template-columns:repeat(2,1fr); gap:1.2rem; margin-top:2.5rem; }
@media (max-width:820px){ .pillars { grid-template-columns:1fr; } }
.pillar { padding:1.8rem; border-left:3px solid var(--accent); background:var(--bg-soft); }
.pillar .n { font-family:'Fraunces',serif; font-style:italic; font-size:1.8rem; color:var(--accent); line-height:1; }
.pillar h3 { font-family:'Fraunces',serif; font-weight:500; font-size:1.2rem; margin:0.4rem 0 0.4rem; }
.pillar p { font-size:0.93rem; color:var(--ink-soft); }

/* --- Kennzahlen-Reihe --- */
.statrow { display:grid; grid-template-columns:repeat(4,1fr); gap:1.5rem; margin-top:2.5rem; }
@media (max-width:680px){ .statrow { grid-template-columns:1fr 1fr; } }
.statrow .s { border-top:1px solid var(--rule); padding-top:1rem; }
.statrow .s .k { font-family:'Fraunces',serif; font-style:italic; font-size:1.8rem; color:var(--accent); line-height:1; }
.statrow .s .v { font-size:0.85rem; color:var(--ink-soft); margin-top:0.4rem; }

/* --- Querverweise zu den Schwester-Häusern --- */
.cross { padding:4.5rem 0; border-top:1px solid var(--rule); }
.cross .eyebrow { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:1rem; }
.cross h2 { font-family:'Fraunces',serif; font-weight:400; font-size:1.7rem; letter-spacing:-0.01em; }
.cross-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:1.8rem; }
@media (max-width:820px){ .cross-grid { grid-template-columns:1fr; } }
/* Variante für vier Häuser auf einer Holding-Seite (z. B. Familie) */
.cross-grid.quad { grid-template-columns:repeat(4,1fr); }
@media (max-width:980px){ .cross-grid.quad { grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){ .cross-grid.quad { grid-template-columns:1fr; } }
.cross-card.holding { border-top-color:var(--terracotta); }
.cross-card { background:var(--bg-soft); padding:1.6rem; text-decoration:none; color:inherit; border-top:3px solid var(--rule); transition:transform .25s, box-shadow .25s; }
.cross-card:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(31,28,23,0.10); }
.cross-card.reisen { border-top-color:var(--ochre); }
.cross-card.wohnen { border-top-color:var(--moss); }
.cross-card.immobilien { border-top-color:var(--burgundy); }
.cross-card.studio { border-top-color:var(--ink-accent); }
.cross-card .nm { font-family:'Fraunces',serif; font-weight:500; font-size:1.2rem; }
.cross-card .r { font-family:'JetBrains Mono',monospace; font-size:0.62rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-soft); margin-top:0.3rem; }

.filters button.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }

.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.8rem; }
@media (max-width:680px){ .stats { grid-template-columns:1fr 1fr; } }
.stat { border-top:1px solid var(--rule); padding-top:0.9rem; }
.stat .k { font-family:'Fraunces',serif; font-style:italic; font-size:1.8rem; line-height:1; color:var(--terracotta); }
.stat .v { font-size:0.82rem; color:var(--ink-soft); margin-top:0.3rem; }

.lead { border:1px solid var(--rule); margin-bottom:0.8rem; background:#fff; }
.lead.neu { border-left:4px solid var(--terracotta); }
.lead.bearbeitung { border-left:4px solid var(--ochre); }
.lead.erledigt { border-left:4px solid var(--moss); opacity:0.75; }
.lead-head { display:grid; grid-template-columns:auto auto 1fr auto; gap:0.9rem; align-items:center; padding:0.9rem 1.1rem; cursor:pointer; }
@media (max-width:600px){ .lead-head { grid-template-columns:auto 1fr; } }
.badge { font-family:'JetBrains Mono',monospace; font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.28rem 0.55rem; white-space:nowrap; }
.badge.neu { background:var(--terracotta); color:var(--bg); }
.badge.bearbeitung { background:var(--ochre); color:var(--ink); }
.badge.erledigt { background:var(--moss); color:var(--bg); }
.typchip { font-family:'JetBrains Mono',monospace; font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.28rem 0.55rem; border:1px solid currentColor; white-space:nowrap; }
.typchip.reisen { color:var(--ochre); } .typchip.wohnen { color:var(--moss); } .typchip.immobilien { color:var(--burgundy); }
.lead-head .id { font-family:'JetBrains Mono',monospace; font-size:0.78rem; }
.lead-head .who { color:var(--ink-soft); font-size:0.9rem; }
.lead-head .when { font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--ink-soft); text-align:right; }
.lead-body { display:none; padding:0 1.1rem 1.2rem; }
.lead.open .lead-body { display:block; }
.lead-body .answers { border-top:1px solid var(--rule); padding-top:1rem; margin-top:0.4rem; }
.lead-body .arow { display:flex; justify-content:space-between; gap:1rem; padding:0.4rem 0; border-bottom:1px dashed var(--rule); font-size:0.92rem; }
.lead-body .arow:last-child { border-bottom:none; }
.lead-body .arow .l { color:var(--ink-soft); }
.lead-body .arow .v { text-align:right; max-width:60%; }
.lead-actions { display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:1rem; }
.mini { font-family:'JetBrains Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.45rem 0.75rem; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; text-decoration:none; transition:all .2s; }
.mini:hover { background:var(--ink); color:var(--bg); }
.mini.active { background:var(--ink); color:var(--bg); }
.mini.danger { border-color:var(--burgundy); color:var(--burgundy); }
.mini.danger:hover { background:var(--burgundy); color:var(--bg); }
.status-set { display:inline-flex; gap:0.3rem; margin-right:0.6rem; }

.empty { text-align:center; padding:3rem 1rem; color:var(--ink-soft); }
.empty .big { font-family:'Fraunces',serif; font-size:1.3rem; color:var(--ink); margin-bottom:0.6rem; }
.note { font-size:0.85rem; color:var(--ink-soft); margin-top:1.6rem; border-top:1px solid var(--rule); padding-top:1rem; }
.io-row { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:1.4rem; }
.toast { position:fixed; left:50%; bottom:2rem; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.08em; padding:0.8rem 1.3rem; opacity:0; transition:opacity .25s; pointer-events:none; z-index:200; }
.toast.show { opacity:1; }
</style>

<main class="admin">
  <div class="wrap">
    <div class="head">
      <h1>Anfragen</h1>
      <p>Hier sammeln Sie die Anfragen aus den Formularen von Reisen, Wohnen und Immobilien. Ziehen Sie die <code>.json</code>-Dateien in das Feld unten — genau wie bei der Bestellverwaltung. Alle Daten bleiben in diesem Browser.</p>
    </div>

    <div class="toolbar">
      <label class="drop" id="drop">
        <div class="t">Anfrage-Dateien hierher ziehen oder klicken</div>
        <div class="s">Akzeptiert die .json-Dateien aus den Anfrageformularen (auch mehrere auf einmal)</div>
        <input type="file" id="file" accept="application/json,.json" multiple style="display:none" />
      </label>
      <div class="filters" id="filters">
        <button data-f="alle" class="active">Alle</button>
        <button data-f="reisen">Reisen</button>
        <button data-f="wohnen">Wohnen</button>
        <button data-f="immobilien">Immobilien</button>
        <span style="width:1px;height:24px;background:var(--rule);margin:0 0.3rem;"></span>
        <button data-f="neu">Neu</button>
        <button data-f="bearbeitung">In Arbeit</button>
        <button data-f="erledigt">Erledigt</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <div id="list"></div>

    <div class="io-row">
      <button class="mini" id="btnExport">Alle Anfragen als Datei sichern</button>
      <button class="mini" id="btnCsv">Für Excel sichern (CSV)</button>
      <label class="mini" style="cursor:pointer;">Sicherung laden<input type="file" id="importFile" accept="application/json,.json" style="display:none" /></label>
    </div>
    <div class="note" id="note"></div>
  </div>
</main>

<script>
/* ============================================================================
   HeiBen — Anfragenverwaltung (eigenständiges Backoffice, ohne Server)
   Spiegelt die Bestellverwaltung: liest .json-Anfragedateien ein, erkennt sie
   am Kennzeichen "heibenLead", vermeidet Doubletten über die id, führt sie im
   Status (neu / in Arbeit / erledigt). Speicher: localStorage mit Rückfall.
   ============================================================================ */
var memStore = {};
var store = {
  get: function (k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : (memStore[k] != null ? memStore[k] : null); } catch (e) { return memStore[k] != null ? memStore[k] : null; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { memStore[k] = v; } }
};
var KEY = 'heiben_leads';
var leads = store.get(KEY) || [];
var filterType = 'alle';   // alle | reisen | wohnen | immobilien
var filterStatus = 'alle'; // alle | neu | bearbeitung | erledigt

var STATUS = ['neu', 'bearbeitung', 'erledigt'];
var STATUS_LABEL = { neu: 'Neu', bearbeitung: 'In Arbeit', erledigt: 'Erledigt' };
var TYPE_LABEL = { reisen: 'Reisen', wohnen: 'Wohnen', immobilien: 'Immobilien' };
var EMPF = { reisen: 'reisen@heiben.de', wohnen: 'wohnen@heiben.de', immobilien: 'immobilien@heiben.de' };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function save() { store.set(KEY, leads); }

function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2600); }

/* Eingelesene Datei prüfen: gültig nur mit kind:'heibenLead' und id; Doubletten
   über die id vermeiden. */
function ingest(obj) {
  if (!obj || obj.kind !== 'heibenLead' || !obj.id) return false;
  if (leads.some(function (l) { return l.id === obj.id; })) return 'dup';
  var copy = Object.assign({}, obj); if (!copy.status) copy.status = 'neu';
  leads.push(copy);
  return true;
}
function handleFiles(fileList) {
  var files = Array.prototype.slice.call(fileList); var ok = 0, dup = 0, bad = 0, pending = files.length;
  if (!pending) return;
  files.forEach(function (f) {
    var rd = new FileReader();
    rd.onload = function () { try { var r = ingest(JSON.parse(rd.result)); if (r === true) ok++; else if (r === 'dup') dup++; else bad++; } catch (e) { bad++; } if (--pending === 0) finish(); };
    rd.onerror = function () { bad++; if (--pending === 0) finish(); };
    rd.readAsText(f);
  });
  function finish() {
    save(); render();
    var msg = []; if (ok) msg.push(ok + ' übernommen'); if (dup) msg.push(dup + ' bereits vorhanden'); if (bad) msg.push(bad + ' nicht lesbar');
    toast(msg.join(' · ') || 'Keine gültigen Anfragen gefunden.');
  }
}

function setStatus(id, st) { var l = leads.find(function (x) { return x.id === id; }); if (l) { l.status = st; save(); render(); } }
function delLead(id) { var l = leads.find(function (x) { return x.id === id; }); if (l && confirm('Anfrage ' + l.id + ' aus der Verwaltung entfernen?')) { leads = leads.filter(function (x) { return x.id !== id; }); save(); render(); } }

/* Lesbaren Text einer Anfrage erzeugen (für „E-Mail beantworten“ und Beleg). */
function leadAnswerRows(l) {
  var a = l.answers || {};
  var rows = '';
  Object.keys(a).forEach(function (k) {
    var v = a[k];
    if (v != null && String(v).trim() !== '' && ['name', 'email', 'telefon', 'kontaktweg'].indexOf(k) === -1) {
      rows += '<div class="arow"><span class="l">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
    }
  });
  return rows;
}

function replyMailto(l) {
  var to = (l.contact && l.contact.email) ? l.contact.email : '';
  var subject = 'Ihre Anfrage bei HeiBen ' + (TYPE_LABEL[l.type] || '') + ' (' + l.id + ')';
  var body = 'Guten Tag ' + ((l.contact && l.contact.name) || '') + ',\n\nvielen Dank für Ihre Anfrage (' + l.id + ').\n\n';
  return 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

function render() {
  var total = leads.length;
  var neu = leads.filter(function (l) { return l.status === 'neu'; }).length;
  var bear = leads.filter(function (l) { return l.status === 'bearbeitung'; }).length;
  var done = leads.filter(function (l) { return l.status === 'erledigt'; }).length;
  $('stats').innerHTML =
    '<div class="stat"><div class="k">' + total + '</div><div class="v">Anfragen gesamt</div></div>' +
    '<div class="stat"><div class="k">' + neu + '</div><div class="v">neu / unbearbeitet</div></div>' +
    '<div class="stat"><div class="k">' + bear + '</div><div class="v">in Arbeit</div></div>' +
    '<div class="stat"><div class="k">' + done + '</div><div class="v">erledigt</div></div>';

  var shown = leads.filter(function (l) {
    return (filterType === 'alle' || l.type === filterType) && (filterStatus === 'alle' || l.status === filterStatus);
  }).sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });

  var list = $('list');
  if (!leads.length) {
    list.innerHTML = '<div class="empty"><div class="big">Noch keine Anfragen.</div>Sobald über ein Anfrageformular eine Anfrage abgeschickt und als Datei gesichert wurde, ziehen Sie die Datei oben in das Feld — sie erscheint dann hier.</div>';
  } else if (!shown.length) {
    list.innerHTML = '<div class="empty">Keine Anfragen für diese Auswahl.</div>';
  } else {
    list.innerHTML = shown.map(cardHtml).join('');
    shown.forEach(function (l) { wireCard(l.id); });
  }
}

function cardHtml(l) {
  var d = l.createdAt ? new Date(l.createdAt).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  var who = (l.contact && l.contact.name) ? l.contact.name : '';
  var stBtns = STATUS.map(function (s) { return '<button class="mini ' + (l.status === s ? 'active' : '') + '" data-st="' + s + '">' + STATUS_LABEL[s] + '</button>'; }).join('');
  var contactRows = '';
  if (l.contact) {
    if (l.contact.email) contactRows += '<div class="arow"><span class="l">E-Mail</span><span class="v">' + esc(l.contact.email) + '</span></div>';
    if (l.contact.telefon) contactRows += '<div class="arow"><span class="l">Telefon</span><span class="v">' + esc(l.contact.telefon) + '</span></div>';
    if (l.contact.kontaktweg) contactRows += '<div class="arow"><span class="l">Kontaktweg</span><span class="v">' + esc(l.contact.kontaktweg) + '</span></div>';
  }
  return '<div class="lead ' + l.status + '" id="l_' + esc(l.id) + '">' +
    '<div class="lead-head" data-toggle="' + esc(l.id) + '">' +
      '<span class="badge ' + l.status + '">' + STATUS_LABEL[l.status] + '</span>' +
      '<span class="typchip ' + l.type + '">' + (TYPE_LABEL[l.type] || l.type) + '</span>' +
      '<span class="who"><span class="id">' + esc(l.id) + '</span>' + (who ? ' · ' + esc(who) : '') + '</span>' +
      '<span class="when">' + d + '</span>' +
    '</div>' +
    '<div class="lead-body">' +
      '<div class="answers">' + contactRows + leadAnswerRows(l) + '</div>' +
      '<div class="lead-actions">' +
        '<span class="status-set">' + stBtns + '</span>' +
        '<a class="mini" href="' + esc(replyMailto(l)) + '">Per E-Mail antworten</a>' +
        '<button class="mini danger" data-del="1">Löschen</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function wireCard(id) {
  var card = $('l_' + id); if (!card) return;
  card.querySelector('.lead-head').addEventListener('click', function () { card.classList.toggle('open'); });
  Array.prototype.forEach.call(card.querySelectorAll('[data-st]'), function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); setStatus(id, b.getAttribute('data-st')); });
  });
  var del = card.querySelector('[data-del]'); if (del) del.addEventListener('click', function (e) { e.stopPropagation(); delLead(id); });
}

/* Filter */
$('filters').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var f = b.getAttribute('data-f');
  if (['reisen', 'wohnen', 'immobilien', 'alle'].indexOf(f) >= 0 && f !== 'neu' && f !== 'bearbeitung' && f !== 'erledigt') {
    // Achtung: 'alle' setzt beide zurück
    if (f === 'alle') { filterType = 'alle'; filterStatus = 'alle'; }
    else { filterType = (filterType === f) ? 'alle' : f; }
  }
  if (['neu', 'bearbeitung', 'erledigt'].indexOf(f) >= 0) { filterStatus = (filterStatus === f) ? 'alle' : f; }
  // aktive Markierung
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
    var xf = x.getAttribute('data-f');
    var on = (xf === 'alle' && filterType === 'alle' && filterStatus === 'alle') || xf === filterType || xf === filterStatus;
    x.classList.toggle('active', on);
  });
  render();
});

/* Datei-Eingang: Klick + Drag & Drop */
var drop = $('drop');
$('file').addEventListener('change', function () { handleFiles(this.files); this.value = ''; });
['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files); });

/* Sichern & Laden des gesamten Bestands */
$('btnExport').addEventListener('click', function () {
  var blob = new Blob([JSON.stringify({ kind: 'heibenLeadStore', version: 1, leads: leads }, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = 'heiben-anfragen-daten.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  toast('Gesichert: heiben-anfragen-daten.json');
});
/* CSV für Excel: Spalten passen zum HeiBen-Lead-Tracker. Semikolon-getrennt
   und mit BOM, damit deutsches Excel Umlaute und Spalten korrekt erkennt. */
$('btnCsv').addEventListener('click', function () {
  var STATUS_LABEL = { neu: 'Neu', bearbeitung: 'In Bearbeitung', erledigt: 'Gewonnen' };
  var cols = ['Anfrage-Nr.', 'Eingegangen', 'Haus', 'Name', 'E-Mail', 'Telefon', 'Kontaktweg', 'Eckdaten', 'Status'];
  function cell(v) {
    v = (v == null) ? '' : String(v);
    if (/[";\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function eckdaten(l) {
    var a = l.answers || {}, parts = [];
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (v != null && String(v).trim() !== '' && ['name', 'email', 'telefon', 'kontaktweg'].indexOf(k) === -1) {
        parts.push(k + ': ' + v);
      }
    });
    return parts.join(' | ');
  }
  function datum(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return (p.length === 3) ? p[2] + '.' + p[1] + '.' + p[0] : iso; }
  var rows = [cols.join(';')];
  leads.slice().sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); }).forEach(function (l) {
    var c = l.contact || {};
    rows.push([
      l.id, datum(l.createdAt), TYPE_LABEL[l.type] || l.type, c.name, c.email,
      c.telefon, c.kontaktweg, eckdaten(l), STATUS_LABEL[l.status] || 'Neu'
    ].map(cell).join(';'));
  });
  var blob = new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = 'heiben-anfragen.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  toast('Gesichert: heiben-anfragen.csv');
});
$('importFile').addEventListener('change', function () {
  var f = this.files && this.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var parsed = JSON.parse(rd.result);
      if (parsed && Array.isArray(parsed.leads)) { leads = parsed.leads; save(); render(); toast('Sicherung geladen.'); }
      else if (parsed && parsed.kind === 'heibenLead') { var r = ingest(parsed); save(); render(); toast(r === true ? '1 Anfrage übernommen.' : 'Bereits vorhanden.'); }
      else throw new Error('Format');
    } catch (err) { alert('Die Datei konnte nicht gelesen werden. Bitte eine gesicherte heiben-anfragen-daten.json oder eine einzelne Anfrage-Datei wählen.'); }
  };
  rd.readAsText(f); this.value = '';
});

$('note').textContent = 'Hinweis: Alle Daten bleiben in diesem Browser. Für eine dauerhafte, mehrplatzfähige Lösung mit automatischem Eingang wird später derselbe Hintergrunddienst angebunden, der auch für den Shop vorgesehen ist; bis dahin sammelt diese Verwaltung Ihre Anfragen verlässlich über die gesicherten Dateien.';

render();
</script>

<script id="hb-motion-js">
(function(){
  if(!('IntersectionObserver' in window)) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var els=[];
  document.querySelectorAll('section, header.subhero, footer').forEach(function(el){ el.classList.add('hb-rv'); els.push(el); });
  document.querySelectorAll('[class*="grid"]').forEach(function(g){
    if(g.closest('nav')) return;
    Array.prototype.slice.call(g.children,0,12).forEach(function(el,i){
      el.classList.add('hb-rv'); el.style.setProperty('--hbd',(Math.min(i,8)*0.075)+'s'); els.push(el);
    });
  });
  els.forEach(function(el){
    el.addEventListener('animationend',function h(){ el.classList.add('hb-done'); el.removeEventListener('animationend',h); });
  });
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('hb-go'); io.unobserve(en.target); } });
  },{threshold:.05,rootMargin:'0px 0px -4% 0px'});
  els.forEach(function(el){ io.observe(el); });
  /* Sicherheitsnetz: nach 3s ist garantiert alles sichtbar */
  setTimeout(function(){ els.forEach(function(el){ el.classList.add('hb-go'); }); io.disconnect(); },3000);
})();
</script>

<script id="hb-pwa">
(function(){
  /* Service-Worker registrieren */
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); });
  }
  /* Bereits als App installiert? Dann keine Aufforderung. */
  function standalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
  if(standalone()) return;
  try{ if(localStorage.getItem('heiben-pwa-dismiss')==='1') return; }catch(e){}
  var deferred=null;
  function bar(html){
    if(document.getElementById('hbInstall')) return document.getElementById('hbInstall');
    var d=document.createElement('div'); d.id='hbInstall';
    d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9000;max-width:520px;margin:0 auto;background:var(--ink,#1f1c17);color:#f3eee5;border-radius:14px;padding:13px 14px;box-shadow:0 14px 40px rgba(31,28,23,.35);display:flex;align-items:center;gap:12px;font-family:Manrope,system-ui,sans-serif;';
    d.innerHTML=html;
    document.body.appendChild(d); return d;
  }
  function dismiss(){ try{localStorage.setItem('heiben-pwa-dismiss','1');}catch(e){} var b=document.getElementById('hbInstall'); if(b) b.remove(); }
  /* Android / Desktop-Chromium: echtes Installieren */
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred=e;
    var d=bar('<img src="assets/favicon-192.png" alt="" style="width:38px;height:38px;border-radius:9px;flex:0 0 auto" />'+
      '<div style="flex:1;line-height:1.35"><b style="font-size:.92rem">HeiBen als App installieren</b><br><span style="font-size:.78rem;opacity:.8">Schnellzugriff, Offline-Nutzung, eigenes Symbol.</span></div>'+
      '<button id="hbInstBtn" style="flex:0 0 auto;border:0;border-radius:8px;background:#b04a31;color:#fff;padding:9px 13px;font-family:\'JetBrains Mono\',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer">Installieren</button>'+
      '<button id="hbInstX" aria-label="Schließen" style="flex:0 0 auto;border:0;background:none;color:#f3eee5;font-size:1.1rem;cursor:pointer;opacity:.7">✕</button>');
    d.querySelector('#hbInstBtn').addEventListener('click',function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ deferred=null; var b=document.getElementById('hbInstall'); if(b) b.remove(); }); });
    d.querySelector('#hbInstX').addEventListener('click',dismiss);
  });
  window.addEventListener('appinstalled',function(){ var b=document.getElementById('hbInstall'); if(b) b.remove(); });
  /* iOS Safari: kein beforeinstallprompt -> Hinweis „Teilen -> Zum Home-Bildschirm" */
  var ua=navigator.userAgent||'';
  var isIOS=/iphone|ipad|ipod/i.test(ua);
  var isSafari=/safari/i.test(ua)&&!/crios|fxios|edgios/i.test(ua);
  if(isIOS&&isSafari){
    setTimeout(function(){
      if(standalone()||document.getElementById('hbInstall')) return;
      var d=bar('<img src="assets/favicon-192.png" alt="" style="width:38px;height:38px;border-radius:9px;flex:0 0 auto" />'+
        '<div style="flex:1;line-height:1.35"><b style="font-size:.92rem">Zum Home-Bildschirm hinzufügen</b><br><span style="font-size:.78rem;opacity:.8">Tippen Sie auf <b>Teilen</b> ▵ und dann „Zum Home-Bildschirm".</span></div>'+
        '<button id="hbInstX" aria-label="Schließen" style="flex:0 0 auto;border:0;background:none;color:#f3eee5;font-size:1.1rem;cursor:pointer;opacity:.7">✕</button>');
      d.querySelector('#hbInstX').addEventListener('click',dismiss);
    },1600);
  }
})();
</script>
