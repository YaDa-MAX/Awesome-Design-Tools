        locked: {type: boolean, description: 'true = Premium und nicht freigeschaltet', examples: [false]}
    Nutrition:
      type: object
      properties:
        energie: {type: number}
        eiweiss: {type: number}
        kh: {type: number}
        fett: {type: number}
