<script src="hb-magazin-core.js"></script>
<script>
(function () {
  var M = window.HeiBenMag;
  var current = 'alle';

  function cardHtml(a) {
    var c = M.CATEGORIES[a.category] || { label: a.category, klass: '' };
    var cover = a.cover
      ? 'style="background-image:url(' + "'" + M.esc(a.cover) + "'" + ')"'
      : '';
    return '<a class="mag-card ' + c.klass + '" href="studio-artikel.html?id=' + encodeURIComponent(a.id) + '">' +
             '<div class="cover" ' + cover + '></div>' +
             '<div class="body">' +
               '<span class="cat ' + c.klass + '">' + M.esc(c.label) + '</span>' +
               '<div class="t">' + M.esc(a.title) + '</div>' +
               '<div class="dek">' + M.esc(a.dek || '') + '</div>' +
               '<div class="meta">' + M.esc(a.author || 'HeiBen Studio') + ' · ' + M.fmtDate(a.date) + ' · ' + M.estimateMinutes(a) + ' Min.</div>' +
             '</div>' +
           '</a>';
  }

  function leadHtml(a) {
    var c = M.CATEGORIES[a.category] || { label: a.category, klass: '' };
    var cover = a.cover ? 'style="background-image:url(' + "'" + M.esc(a.cover) + "'" + ')"' : '';
    return '<a class="mag-lead" href="studio-artikel.html?id=' + encodeURIComponent(a.id) + '">' +
             '<div class="cover" ' + cover + '></div>' +
             '<div class="body">' +
               '<span class="badge">Aktueller Beitrag</span>' +
               '<span class="cat ' + c.klass + '">' + M.esc(c.label) + '</span>' +
               '<h2>' + M.esc(a.title) + '</h2>' +
               '<div class="dek">' + M.esc(a.dek || '') + '</div>' +
               '<div class="meta">' + M.esc(a.author || 'HeiBen Studio') + ' · ' + M.fmtDate(a.date) + ' · ' + M.estimateMinutes(a) + ' Min. Lesezeit</div>' +
             '</div>' +
           '</a>';
  }

  function render() {
    var all = M.getPublished();
    var list = current === 'alle' ? all : all.filter(function (a) { return a.category === current; });

    var leadEl = document.getElementById('lead');
    var gridEl = document.getElementById('grid');
    var emptyEl = document.getElementById('empty');

    // Aufmacher nur in der Gesamtansicht; in Filteransichten alles als Karten.
    if (current === 'alle' && list.length) {
      leadEl.innerHTML = leadHtml(list[0]);
      gridEl.innerHTML = list.slice(1).map(cardHtml).join('');
    } else {
      leadEl.innerHTML = '';
      gridEl.innerHTML = list.map(cardHtml).join('');
    }
    emptyEl.style.display = list.length ? 'none' : 'block';
  }

  function buildFilter() {
    var el = document.getElementById('filter');
    var btns = ['<button data-cat="alle" class="active">Alle</button>'];
    M.CATEGORY_ORDER.forEach(function (k) {
      btns.push('<button data-cat="' + k + '">' + M.esc(M.CATEGORIES[k].label) + '</button>');
    });
    el.innerHTML = btns.join('');
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      current = b.getAttribute('data-cat');
      Array.prototype.forEach.call(el.querySelectorAll('button'), function (x) { x.classList.toggle('active', x === b); });
      render();
    });
  }

  buildFilter();
  render();
})();
</script>
